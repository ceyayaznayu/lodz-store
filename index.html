<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Łódź Store</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f4f4f4;
  color:#111;
}

header{
  background:#000;
  color:#fff;
  padding:25px 20px;
}

header h1{
  font-size:30px;
}

header p{
  color:#bdbdbd;
  margin-top:5px;
}

.search{
  padding:18px;
}

.search input{
  width:100%;
  padding:15px;
  border:none;
  border-radius:15px;
  font-size:16px;
  background:white;
}

.categories{
  display:flex;
  overflow:auto;
  gap:10px;
  padding:0 18px 18px;
}

.categories button{
  border:none;
  background:#fff;
  padding:10px 16px;
  border-radius:30px;
  font-weight:bold;
}

.categories button:first-child{
  background:#000;
  color:white;
}

.products{
  padding:18px;
}

.card{
  background:white;
  border-radius:20px;
  padding:16px;
  margin-bottom:18px;
  box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card img{
  width:100%;
  border-radius:15px;
}

.name{
  font-size:20px;
  font-weight:bold;
  margin-top:12px;
}

.model{
  color:#666;
  margin-top:5px;
}

.price{
  color:#0a8f34;
  font-size:22px;
  font-weight:bold;
  margin-top:12px;
}

.buy{
  width:100%;
  margin-top:15px;
  border:none;
  background:black;
  color:white;
  padding:14px;
  border-radius:14px;
  font-size:16px;
}
</style>

</head>

<body>

<header>
<h1>Łódź Store</h1>
<p>Apple • Vape • Польща 🇵🇱</p>
</header>

<div class="search">
<input placeholder="🔍 Пошук товару...">
</div>

<div class="categories">
<button>Усі</button>
<button>ELFBAR</button>
<button>VOZOL</button>
<button>MASKKING</button>
<button>LOST MARY</button>
</div>

<div class="products">

<div class="card">
<img src="https://placehold.co/600x400/000000/FFFFFF?text=ELFBAR+D3" alt="ELFBAR D3">
<div class="name">ELFBAR D3</div>
<div class="model">25000 затяжок</div>
<div class="price">65 zł</div>
<button class="buy">Купити</button>
</div>

<div class="card">
<img src="https://placehold.co/600x400/111111/FFFFFF?text=ELFBAR+GH+PRO" alt="GH PRO">
<div class="name">ELFBAR GH PRO</div>
<div class="model">33000 затяжок</div>
<div class="price">75 zł</div>
<button class="buy">Купити</button>
</div>

<div class="card">
<img src="https://placehold.co/600x400/222222/FFFFFF?text=VOZOL+VISTA" alt="VOZOL VISTA">
<div class="name">VOZOL VISTA</div>
<div class="model">40000 затяжок</div>
<div class="price">80 zł</div>
<button class="buy">Купити</button>
</div>

<div class="card">
<img src="https://placehold.co/600x400/333333/FFFFFF?text=MASKKING+MALUX" alt="MASKKING MALUX">
<div class="name">MASKKING MALUX</div>
<div class="model">50000 затяжок</div>
<div class="price">90 zł</div>
<button class="buy">Купити</button>
</div>

<div class="card">
<img src="https://placehold.co/600x400/444444/FFFFFF?text=LOST+MARY+TURBO" alt="LOST MARY TURBO">
<div class="name">LOST MARY TURBO</div>
<div class="model">50000 затяжок</div>
<div class="price">95 zł</div>
<button class="buy">Купити</button>
</div>

</div>

</body>
</html>
