
<!DOCTYPE html>
<html lang="uk">

<head>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Łódź Store</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .header {
      background: #111;
      color: white;
      text-align: center;
      padding: 28px 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 7px 0 0;
      color: #aaa;
    }

    .search {
      padding: 15px;
    }

    .search input {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
    }

    .categories {
      display: flex;
      gap: 10px;
      padding: 0 15px 15px;
      overflow-x: auto;
    }

    .categories button {
      border: 0;
      background: white;
      padding: 11px 18px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .categories button.active {
      background: #111;
      color: white;
    }

    .title {
      padding: 5px 15px 15px;
      font-size: 21px;
      font-weight: bold;
    }

    .products {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 15px 30px;
    }

    .product {
      background: white;
      border-radius: 16px;
      overflow: hidden;
    }

    .photo {
      height: 150px;
      background: #e9e9e9;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #999;
    }

    .info {
      padding: 12px;
    }

    .name {
      font-weight: bold;
      font-size: 15px;
    }

    .price {
      margin-top: 8px;
      font-weight: bold;
      font-size: 17px;
    }

    .button {
      width: 100%;
      margin-top: 10px;
      padding: 11px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: white;
    }

  </style>

</head>

<body>

  <div class="header">

    <h1>Łódź Store</h1>

    <p>Каталог товарів</p>

  </div>

  <div class="search">

    <input
      type="text"
      id="search"
      placeholder="🔎 Пошук товару..."
      oninput="searchProducts()"
    >

  </div>

  <div class="categories">

    <button class="active" onclick="filterProducts('all', this)">
      Усі
    </button>

    <button onclick="filterProducts('category1', this)">
      Категорія 1
    </button>

    <button onclick="filterProducts('category2', this)">
      Категорія 2
    </button>

  </div>

  <div class="title">
    Товари
  </div>

  <div class="products" id="products">

    <div class="product" data-category="category1">

      <div class="photo">
        Фото
      </div>

      <div class="info">

        <div class="name">
          Демонстраційний товар
        </div>

        <div class="price">
          00 zł
        </div>

        <button class="button" onclick="alert('Товар відкрито')">
          Переглянути
        </button>

      </div>

    </div>

    <div class="product" data-category="category2">

      <div class="photo">
        Фото
      </div>

      <div class="info">

        <div class="name">
          Демонстраційний товар 2
        </div>

        <div class="price">
          00 zł
        </div>

        <button class="button" onclick="alert('Товар відкрито')">
          Переглянути
        </button>

      </div>

    </div>

  </div>


  <script>

    function filterProducts(category, button) {

      document.querySelectorAll('.categories button').forEach(btn => {
        btn.classList.remove('active');
      });

      button.classList.add('active');

      document.querySelectorAll('.product').forEach(product => {

        if (
          category === 'all' ||
          product.dataset.category === category
        ) {
          product.style.display = '';
        } else {
          product.style.display = 'none';
        }

      });

    }


    function searchProducts() {

      const search = document
        .getElementById('search')
        .value
        .toLowerCase();

      document.querySelectorAll('.product').forEach(product => {

        const name = product
          .querySelector('.name')
          .innerText
          .toLowerCase();

        if (name.includes(search)) {
          product.style.display = '';
        } else {
          product.style.display = 'none';
        }

      });

    }


    const SUPABASE_URL = "https://vcrgepkqttvmqzjchnia.supabase.co";

    const SUPABASE_KEY = "sb_publishable_QLvfUimqEofmWFNR5fprAw_jj-BEsbA";


    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    async function loadProducts() {

      const { data, error } = await supabaseClient
        .from('products')
        .select('*');

      if (error) {

        console.error(
          'Помилка завантаження товарів:',
          error
        );

        return;
      }

      console.log('Товари:', data);

      return data;

    }


    loadProducts();

  </script>

</body>

</html>
```
